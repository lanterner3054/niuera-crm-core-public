name: Security scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile security scan script
        run: python3 -m py_compile scripts/security_scan.py

      - name: Run security scan
        run: python3 scripts/security_scan.py
